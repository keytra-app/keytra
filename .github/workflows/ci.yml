name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Dummy URL: src/db throws on import without one; nothing connects.
      DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Keep in sync with the Dockerfile.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generates the route types that tsc needs on a fresh checkout.
      - run: pnpm exec next typegen
      - run: npx tsc --noEmit
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
