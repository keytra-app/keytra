version: 2
updates:
  # "npm" also covers pnpm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node major used by the Dockerfile.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Node majors are upgraded by hand, together with CI.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
