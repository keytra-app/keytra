# Production / self-hosting: `docker compose up -d`. Dev database: docker-compose.dev.yml.
# Own project name, so `down` here never touches the dev stack in the same directory.
name: keytra-prod

services:
  keytra:
    image: ghcr.io/keytra-app/keytra:latest
    # build: . # uncomment to build from source, then `docker compose up -d --build`
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://keytra:${POSTGRES_PASSWORD:-keytra}@postgres:5432/keytra}
      AUTH_SECRET: ${AUTH_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keytra
      # Only applied when the volume is first created. Use URL-safe characters (e.g. `openssl rand -hex 24`).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keytra}
      POSTGRES_DB: keytra
    volumes:
      - keytra_pg_data:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP: the temporary server during first-time init only listens on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U keytra -d keytra"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  keytra_pg_data:
